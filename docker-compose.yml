services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: alexeidocs
      POSTGRES_PASSWORD: alexeidocs
      POSTGRES_DB: alexeidocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://alexeidocs:alexeidocs@db:5432/alexeidocs?schema=public"
      NEXTAUTH_SECRET: "change-this-to-a-secure-random-string"
      NEXTAUTH_URL: "http://45.13.237.33:3000"
      AUTH_TRUST_HOST: "true"
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  bot:
    build: ./bot
    restart: always
    environment:
      BOT_TOKEN: "7896459085:AAFgLzE67m799llUVAThCS6cqITwZOypO00"
      WEBAPP_URL: "http://45.13.237.33:3000"
      WEBAPP_INTERNAL_URL: "http://app:3000"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
